# Runs the full test suite on every PR and every push to main, against a throwaway
# Postgres that exists only for this run. A red check means: don't merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres   # throwaway, exists only inside this job
          POSTGRES_DB: revenuepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (including SQL-vs-pandas KPI tests)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/revenuepulse_test
        run: pytest -q -rs
