# Rebuilds the Supabase database from scratch and loads the seeded synthetic data.
# Manual only: Actions tab -> "Load data" -> Run workflow.
name: Load data

on:
  workflow_dispatch:

# Two clicks must never run overlapping rebuilds.
concurrency:
  group: load-data
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Gate: if the generator or its planted patterns are broken, nothing touches Supabase.
      - name: Run tests
        run: pytest -q

      - name: Load data into Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CHAT_DB_PASSWORD: ${{ secrets.CHAT_DB_PASSWORD }}  # empty if unset: password left unchanged
        run: python -m data.load
