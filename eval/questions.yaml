# RevenuePulse chatbot eval set: 25 questions. DRAFT by Claude, for Harsh to review and own.
#
# Scoring (eval/run_eval.py):
#   value     correct if ANY numeric cell in the returned rows is within `tolerance` (relative)
#             of `value`. A percentage is also accepted (0.1679 or 16.79).
#   contains  correct if EVERY listed string appears in some cell (case-insensitive).
#   refused   correct only if the chatbot refuses (status "refused").
# Lenient on purpose: it checks the right number is in the answer, not that nothing else is.
#
# `source_sql` is how each expected answer was computed. tests/test_eval_questions.py re-runs
# every one against the seeded data on each PR, so the answer key can't drift silently.
# Rule: once the baseline is logged, don't edit questions to make the model look better.

- id: q01
  question: What was the overall win rate from April 2025 to September 2026?
  type: single_kpi
  expected:
    value: 0.2872
    tolerance: 0.01
  source_sql: SELECT round(sum(won_count)::numeric / NULLIF(sum(won_count)+sum(lost_count),0), 4) FROM v_monthly_region_kpis
- id: q02
  question: What is the average deal size of won deals across the whole reporting period?
  type: single_kpi
  expected:
    value: 35171.61
    tolerance: 0.01
  source_sql: SELECT round(sum(won_value) / NULLIF(sum(won_count),0), 2) FROM v_monthly_region_kpis
- id: q03
  question: What is the average sales cycle in days for closed deals?
  type: single_kpi
  expected:
    value: 49.69
    tolerance: 0.01
  source_sql: SELECT round(sum(cycle_days_sum)::numeric / NULLIF(sum(closed_count),0), 2) FROM v_monthly_region_kpis
- id: q04
  question: How many deals are currently open?
  type: single_kpi
  expected:
    value: 965.0
    tolerance: 0.01
  source_sql: SELECT open_deals FROM mv_pipeline_velocity WHERE region = 'All'
- id: q05
  question: What is the current pipeline velocity per day for the whole company?
  type: single_kpi
  expected:
    value: 183399.18
    tolerance: 0.01
  source_sql: SELECT round(velocity_per_day, 2) FROM mv_pipeline_velocity WHERE region = 'All'
- id: q06
  question: What was the West region's win rate in August 2025?
  type: filtered_kpi
  expected:
    value: 0.1679
    tolerance: 0.01
  source_sql: SELECT round(win_rate, 4) FROM v_monthly_region_kpis WHERE region = 'West' AND month = '2025-08-01'
- id: q07
  question: What was the total closed-won value in Q4 2025?
  type: filtered_kpi
  expected:
    value: 21668798.44
    tolerance: 0.01
  source_sql: SELECT round(sum(won_value), 2) FROM v_monthly_region_kpis WHERE quarter = '2025-10-01'
- id: q08
  question: What is the average deal size of won Enterprise deals?
  type: filtered_kpi
  expected:
    value: 107624.52
    tolerance: 0.01
  source_sql: SELECT round(avg(amount), 2) FROM v_deal_facts WHERE is_won AND company_size = 'Enterprise' AND closed_date
    >= '2025-04-01'
- id: q09
  question: How many deals were created in January 2026?
  type: filtered_kpi
  expected:
    value: 597.0
    tolerance: 0.01
  source_sql: SELECT sum(deals_created) FROM mv_funnel_monthly WHERE month = '2026-01-01'
- id: q10
  question: For deals created in January 2026, what share of Qualified deals reached Proposal?
  type: funnel
  expected:
    value: 0.7351
    tolerance: 0.01
  source_sql: SELECT round(sum(reached_proposal)::numeric / NULLIF(sum(reached_qualified),0), 4) FROM mv_funnel_monthly
    WHERE month = '2026-01-01'
- id: q11
  question: Show the West region's win rate by quarter.
  type: trend
  expected:
    value: 0.1928
    tolerance: 0.01
  source_sql: SELECT round(sum(won_count)::numeric / NULLIF(sum(won_count)+sum(lost_count),0), 4) FROM v_monthly_region_kpis
    WHERE region = 'West' AND quarter = '2025-07-01'
- id: q12
  question: Which region had the lowest win rate in Q3 2025?
  type: ranking
  expected:
    contains:
    - West
  source_sql: SELECT region FROM v_monthly_region_kpis WHERE quarter = '2025-07-01' GROUP BY region ORDER BY sum(won_count)::numeric
    / NULLIF(sum(won_count)+sum(lost_count),0) LIMIT 1
- id: q13
  question: Which month had the highest closed-won value?
  type: ranking
  expected:
    contains:
    - 2025-12
  source_sql: SELECT to_char(month, 'YYYY-MM') FROM v_monthly_region_kpis GROUP BY month ORDER BY sum(won_value)
    DESC LIMIT 1
- id: q14
  question: Which region had the highest win rate in Q2 2026?
  type: ranking
  expected:
    contains:
    - West
  source_sql: SELECT region FROM v_monthly_region_kpis WHERE quarter = '2026-04-01' GROUP BY region ORDER BY sum(won_count)::numeric
    / NULLIF(sum(won_count)+sum(lost_count),0) DESC LIMIT 1
- id: q15
  question: Which two sales reps have the lowest average quota attainment?
  type: planted_pattern
  expected:
    contains:
    - Jamie Arnold
    - Daniel Wagner
  source_sql: SELECT rep_name FROM v_quota_attainment WHERE is_complete_quarter GROUP BY rep_name ORDER BY avg(attainment)
    LIMIT 2
- id: q16
  question: What was rep 4's quota attainment in Q3 2025?
  type: planted_pattern
  expected:
    value: 0.6531
    tolerance: 0.01
  source_sql: SELECT round(attainment, 4) FROM v_quota_attainment WHERE rep_id = 4 AND quarter = '2025-07-01'
- id: q17
  question: How much higher was closed-won value in Q4 2025 than the average Q2/Q3 quarter? Give the relative uplift.
  type: planted_pattern
  expected:
    value: 0.2972
    tolerance: 0.01
  source_sql: WITH q AS (SELECT quarter, sum(won_value) v FROM v_monthly_region_kpis GROUP BY quarter) SELECT round((SELECT
    v FROM q WHERE quarter='2025-10-01') / (SELECT avg(v) FROM q WHERE extract(quarter FROM quarter) IN (2,3)) -
    1, 4)
- id: q18
  question: On which day in August 2026 did the East region have its highest new pipeline value?
  type: planted_pattern
  expected:
    contains:
    - '2026-08-19'
  source_sql: SELECT day::text FROM v_daily_region_metrics WHERE region = 'East' AND day BETWEEN '2026-08-01' AND
    '2026-08-31' ORDER BY new_pipeline_value DESC LIMIT 1
- id: q19
  question: What was the North region's new pipeline value on 14 May 2025?
  type: planted_pattern
  expected:
    value: 1431274.28
    tolerance: 0.01
  source_sql: SELECT round(new_pipeline_value, 2) FROM v_daily_region_metrics WHERE region = 'North' AND day = '2025-05-14'
- id: q20
  question: How many accounts have a churn-risk score of 60 or more?
  type: churn
  expected:
    value: 56.0
    tolerance: 0.01
  source_sql: SELECT count(*) FROM mv_churn_risk WHERE churn_risk_score >= 60
- id: q21
  question: Which account has the highest churn-risk score?
  type: churn
  expected:
    contains:
    - Conner, Li and Santiago
  source_sql: SELECT account_name FROM mv_churn_risk ORDER BY churn_risk_score DESC, account_id LIMIT 1
